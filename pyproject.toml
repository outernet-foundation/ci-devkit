[project]
name = "ci-devkit"
version = "0.0.0.dev0"
description = "CI runner floor: Actions step wrapper, runner and toolchain provisioning, and the OCI artifact cache"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_devkit"]
include = ["src/ci_devkit/py.typed", "src/ci_devkit/third-party/**"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src"]

[tool.python-devkit.preflight]
tests = false
