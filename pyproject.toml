[project]
name = "build-artifact-registry"
version = "0.0.0.dev0"
description = "Registry primitives for pushing and pulling build artifacts, locally or remotely"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_artifact_registry"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src"]

[tool.deptry]
# self-declaration: bridges the deptry root-scan DEP003 misclassification until the sidecar
# relocks onto python-devkit's deptry-src fix; deleted in the Phase 7 fleet sweep
# (plan-devkit-rearchitecture.md)
known_first_party = ["build_artifact_registry"]

[tool.python-devkit.preflight]
tests = false
